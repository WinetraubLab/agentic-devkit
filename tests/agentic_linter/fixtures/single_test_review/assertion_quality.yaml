assertion_quality_005_per_source_test:
  file_docstring: |
    """Tests in this file validate `repository_validation` located at `src/examples/repository_validation.py`.
    `repository_validation` is responsible for validating repository module coverage.

    Terms:
    - `source module`: A source module is a non-`__init__.py` Python file under src/agentic_devkit. For example, src/agentic_devkit/cli/main.py is a source module.
    - `test module`: A test module is a test_*.py file under tests. For example, tests/cli/test_main.py is a test module.
    """
  test: |
    def test_repository_modules_have_test_files(self) -> None:
        """Test Path: happy path

        Requirement Tested:
        `repository_validation` requires at least one `test module`.
        Standard usage: The scenario demonstrates baseline behavior.

        Verification Method: verify private function output

        Verification Detail:
        `_missing_test_paths` produces `[]`.

        Similar Coverage:
        - Other test: `test_source_module_structure.py::test_rejects_module_without_test_file`
          Relative level: lower than this test
        """

        repo_root = Path(__file__).resolve().parents[2]
        package_root = repo_root / "src" / "agentic_devkit"
        test_root = repo_root / "tests"
        self.assertEqual(
            [],
            _missing_test_paths(
                package_root=package_root,
                test_root=test_root,
            ),
        )
  expected_scorecard:
    16: # Requirement Fits Declared Module Responsibility
      pass # Source-to-test module coverage belongs to repository validation.
    12: # Second Line Describes a Scenario
      pass # The standard-usage sentence uses the exact baseline-behavior classification.
    13: # Requirement Has the Appropriate Specificity
      fail # Requiring at least one test module omits the per-source correspondence enforced across the repository.
    51: # Assertions Prove the Stated Requirement
      fail # The assertion enforces one matching test path for every source module, which is stronger than requiring at least one test module.
