# Test-source examples for agent review.
# Each example contains only `file_docstring`, `test`, and `expected_scorecard`.
# Criteria omitted from `expected_scorecard` are ignored during comparison.
# Criterion comments must match their titles in `single_test_review.agent.md.j2`.
# Each outcome must be `pass` or `fail` followed by an explanation comment.

assertion_quality_001_extra_assertion_proves:
  file_docstring: |
    """Tests in this file validate `calculator` located at `src/examples/calculator.py`.
    `calculator` is responsible for arithmetic calculations.

    For example, this file contains one test function.
    """
  test: |
    def test_adds_numbers() -> None:
        """Test Path: happy path

        Requirement Tested:
        `calculator` returns a positive result after adding positive numbers.

        Verification Method: verify public function output

        Verification Detail:
        The result is positive.
        """

        a = 1
        b = 2
        c = add_2_positive_numbers(a, b)
        assert c > 0
        assert c == a + b
  expected_scorecard:
    16: # Requirement Fits Declared Module Responsibility
      pass # Positive-number addition belongs to the calculator's arithmetic responsibility.
    14: # Requirement Is Atomic
      pass # The requirement states one positive-result behavior; the unrelated assertion is evaluated by criterion 51.
    51: # Assertions Prove the Stated Requirement
      fail # Exact addition is outside the stated positive-result requirement.

assertion_quality_002_exact_expected_value:
  file_docstring: |
    """Tests in this file validate `calculator` located at `src/examples/calculator.py`.
    `calculator` is responsible for arithmetic calculations.

    For example, this file contains one test function.
    """
  test: |
    def test_adds_numbers() -> None:
        """Test Path: happy path

        Requirement Tested:
        `calculator` adds positive numbers.
        Standard usage: The scenario demonstrates baseline behavior.

        Verification Method: verify public function output

        Verification Detail:
        The result equals `3`.
        """

        first = 1
        second = 2
        expected_result = 3
        result = add_positive_numbers(first, second)
        assert result == expected_result
  expected_scorecard:
    16: # Requirement Fits Declared Module Responsibility
      pass # Adding positive numbers belongs to the calculator's arithmetic responsibility.
    21: # Verification Detail States Material Outcomes
      pass # The exact result exemplifies the addition contract and belongs in Verification Detail.
    51: # Assertions Prove the Stated Requirement
      pass # The exact observed sum proves the stated addition contract without creating another requirement.
    53: # Test Values Are Local
      pass # The test body defines both inputs and the expected result.

