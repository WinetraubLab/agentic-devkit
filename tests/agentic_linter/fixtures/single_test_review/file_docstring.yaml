file_docstring_006_alternate_context_name:
  file_docstring: |
    """Tests in this file validate `test_source_module_structure` located at `tests/repository_health/test_source_module_structure.py`.
    `test_source_module_structure` is responsible for enforcing repository source-module and test-module structure.

    Terms:
    - `source module`: A source module is a non-`__init__.py` Python file under src/agentic_devkit. For example, tests/cli/test_main.py matches src/agentic_devkit/cli/main.py.
    - `test module`: A test module is a test_*.py file under tests. For example, tests/cli/test_main.py is a test module.
    - `test-harness module`: A test-harness module is a same-basename non-test Python file beside a test module or inside its folder's test_harness package. For example, test_harness/mock_keyword_identification.py supports test_mock_keyword_identification.py.
    - `data-only module`: A data-only module is indexing_test_functions/extracted_test_record.py or version.py. For example, version.py exposes version data instead of public functions.
    """
  test: |
    def test_enforces_public_function_limit(self) -> None:
        """Test Path: failure path

        Requirement Tested:
        `test_source_module_structure` emits a violation when a `source module` exposes fewer than one or more than two public functions.
        Specialized usage: A source module exposes zero or three public functions instead of one or two, so `test_source_module_structure` emits a violation.

        Verification Method: verify private function output

        Verification Detail:
        `_public_api_violations` identifies controlled modules with zero or three public functions.
        `_public_api_violations` accepts a controlled module with two public functions.
        """

        with tempfile.TemporaryDirectory() as directory:
            controlled_root = Path(directory)
            (controlled_root / "empty.py").write_text("", encoding="utf-8")
            (controlled_root / "valid.py").write_text(
                "def first(): pass\ndef second(): pass\n",
                encoding="utf-8",
            )
            three_functions = (
                "def first(): pass\n"
                "def second(): pass\n"
                "def third(): pass\n"
            )
            (controlled_root / "excess.py").write_text(
                three_functions,
                encoding="utf-8",
            )

            controlled_violations = _public_api_violations(
                controlled_root,
                set(),
            )

        self.assertEqual(
            [
                "empty.py: expected 1-2 public functions, found []",
                "excess.py: expected 1-2 public functions, "
                "found ['first', 'second', 'third']",
            ],
            controlled_violations,
        )
  expected_scorecard:
    44: # File Docstring Uses One Label per Referent
      fail # `source module` and `data-only module` are too close to distinguish their referents clearly.
    46: # Terms Reuse Shared Vocabulary
      fail # `controlled module` renames the established `source module` according to its test context.

file_docstring_007_similar_artifact_names:
  file_docstring: |
    """Tests in this file validate `agent_review_example_runner` located at `tests/agentic_linter/test_harness/agent_review_example_runner.py`.
    `agent_review_example_runner` is responsible for orchestrating YAML-example evaluations.

    Terms:
    - `runner JSON`: Runner JSON is the readable `agent_review_example_runner` report at tests/agentic_linter/test_agent_review_example_runner.json. For example, every completed YAML-example evaluation overwrites this file.
    - `runner JSONL`: Runner JSONL is the committed proof for criteria enforced by each YAML case at tests/agentic_linter/test_agent_review_example_runner.jsonl. Current proof corresponds to every source and expected scorecard in the `YAML fixture catalog`.
    - `YAML fixture catalog`: The YAML fixture catalog is repository data evaluated by `agent_review_example_runner`. For example, each entry supplies an example and its expected scorecard as the subject of evaluation.
    - `timer start`: Timer start marks when measurement begins for the total time needed to run the agentic linter on the YAML examples. For example, the timer starts before YAML validation.
    - `timer end`: Timer end marks when runtime measurement stops after YAML scorecards have been compared. For example, elapsed review time uses timer end as its completion timestamp.
    """
  test: |
    def test_stale_attestation_requires_review(self) -> None:
        """Test Path: failure path

        Requirement Tested:
        `agent_review_example_runner` creates '.agent.md' files when `runner JSONL` attestations are stale.
        Specialized usage: When one attestation contains an outdated source hash, `agent_review_example_runner` creates one '.agent.md' file.

        Verification Method: verify public function output

        Verification Detail:
        Harness applies mock.patch to provide an isolated artifact directory and stale proof path.
        1. Harness initializes an isolated proof file from committed `runner JSONL`.
        2. Harness substitutes one source hash with a stale value.
        3. Runner evaluates the complete `YAML fixture catalog`.
        4. Artifact directory contains one '.agent.md' file.
        """

        examples_path = (
            REPO_ROOT / "tests/agentic_linter/fixtures/single_test_review"
        )
        committed_attestations = (
            REPO_ROOT
            / "tests"
            / "agentic_linter"
            / "test_agent_review_example_runner.jsonl"
        )

        with tempfile.TemporaryDirectory() as temporary_directory:
            temporary_root = Path(temporary_directory)
            anonymous_root = temporary_root / "agent_review_examples"
            artifact_root = anonymous_root / "agentic_review_artifacts"
            attestation_path = temporary_root / "stale.jsonl"
            records = [
                json.loads(line)
                for line in committed_attestations.read_text(
                    encoding="utf-8"
                ).splitlines()
            ]
            stale_record = next(
                record
                for record in records
                if record["yaml_case"] == "requirement_formulation_004_ambiguous_input_case"
            )
            stale_record["source_sha256"] = "0" * 64
            attestation_path.write_text(
                "".join(json.dumps(record) + "\n" for record in records),
                encoding="utf-8",
            )

            with mock.patch.multiple(
                runner_harness,
                ANONYMOUS_ROOT=anonymous_root,
                ARTIFACT_ROOT=artifact_root,
                SCORECARD_ATTESTATION_PATH=attestation_path,
                REVIEW_START_PATH=anonymous_root / ".review_started_at",
            ):
                with self.assertRaises(RuntimeError) as raised:
                    run_agent_review_examples(
                        examples_path=examples_path,
                        reviewer_model="5.6 Sol Medium",
                    )

            error_text = str(raised.exception)
            reported_packets = [
                line
                for line in error_text.splitlines()
                if line.startswith("- ") and line.endswith(".agent.md")
            ]

        self.assertEqual(1, len(reported_packets))
  expected_scorecard:
    44: # File Docstring Uses One Label per Referent
      fail # `runner JSON` and `runner JSONL` differ by only one subtle suffix character and are not readily distinguishable.

file_docstring_008_changed_canonical_phrase:
  file_docstring: |
    """Tests in this file validate `test_agent_review_yaml_fixture_contract` located at `tests/repository_health/test_agent_review_yaml_fixture_contract.py`.
    `test_agent_review_yaml_fixture_contract` is responsible for enforcing repository policy for maintainable agent-review YAML examples.

    Terms:
    - `supported fields`: Supported fields are file_docstring, test, and expected_scorecard. For example, an owner field is outside the supported fields.
    """
  test: |
    def test_rejects_unsupported_fields(self) -> None:
        """Test Path: failure path

        Requirement Tested:
        `test_agent_review_yaml_fixture_contract` emits an unsupported-field error for an owner field outside `supported fields`.
        Specialized usage: One YAML example contains an owner field instead of only `supported fields`, so validation emits the unsupported-field error.

        Verification Method: verify public function output

        Verification Detail:
        Validation errors contain "unsupported field `owner`".

        Similar Coverage:
        - Higher Level Test: `test_agent_review_example_runner.py::test_anonymous_agent_review_examples`
          Justification: Diagnostic completeness — The current test isolates unsupported-field validation. The higher test runs the complete YAML fixture catalog.
        """

        invalid_source = textwrap.dedent(
            '''
            # Test-source examples for agent review.
            # Each example contains only `file_docstring`, `test`, and `expected_scorecard`.
            # Criteria omitted from `expected_scorecard` are ignored during comparison.
            # Criterion comments must match their titles in `single_test_review.agent.md.j2`.
            # Each outcome must be `pass` or `fail` followed by an explanation comment.

            unsupported_owner:
              owner: parser
              test: |
                def test_example() -> None:
                    """Test Path: happy path

                    Requirement Tested:
                    Addition calculates sums.
                    When operands contain integers, addition calculates sums.

                    Verification Method: verify public function output

                    Verification Detail:
                    The expression produces `2`.
                    """

                    assert 1 + 1 == 2
              expected_scorecard:
                11: # First Line States a General Behavioral Rule
                  pass # The requirement states the calculation behavior.
            '''
        ).lstrip()
        with tempfile.TemporaryDirectory() as directory:
            example_file = Path(directory) / "invalid.yaml"
            example_file.write_text(invalid_source, encoding="utf-8")
            errors = lint_agent_review_examples(examples_path=example_file)

        matching_errors = [
            error for error in errors if "unsupported field `owner`" in error
        ]
        self.assertTrue(matching_errors)
  expected_scorecard:
    44: # File Docstring Uses One Label per Referent
      pass # File Docstring establishes only one label for each referent.
    46: # Terms Reuse Shared Vocabulary
      fail # `One YAML example` omits the `agent-review` modifier and changes the established plural phrase `agent-review YAML examples` to singular.

file_docstring_009_readme_name_shorthand:
  file_docstring: |
    """Tests in this file validate `test_review_documentation` located at `tests/repository_health/test_review_documentation.py`.
    `test_review_documentation` is responsible for requiring README.md and docs/workflows/github-actions.md to document the supported pre-commit review and CI/CD validation workflows.

    Terms:
    - `reviewer identity`: A reviewer identity records the agent and model that completed a review. For example, `codex:gpt-5.5` is a reviewer identity.
    - `lint arguments`: Lint arguments are exactly `lint`, `--reviewer`, and one reviewer identity in that order. For example, `lint --reviewer codex:gpt-5.5` supplies the lint arguments.
    - `pre-commit review workflow`: The pre-commit review workflow orders three stages: run `agentic-devkit tdd create-agent-md` to create `.agent.md` files, complete their scorecards, and run reviewer-authenticated lint to persist proof.
    - `CI/CD validation workflow`: The CI/CD validation workflow validates committed tests and manifest proof without creating scorecards. For example, GitHub Actions runs lint after changes are committed.
    """
  test: |
    def test_readme_names_both_workflows(self) -> None:
            """Test Path: happy path

            Requirement Tested:
            `test_review_documentation` requires README level-three headings: `pre-commit review workflow` and `CI/CD validation workflow`.
            Standard usage: The scenario demonstrates baseline behavior.

            Verification Method: verify public function output

            Verification Detail:
            README contents contain `### Pre-commit review workflow`.
            README contents contain `### CI/CD validation workflow`.
            """

            repo_root = Path(__file__).resolve().parents[2]
            readme = (repo_root / "README.md").read_text(encoding="utf-8")

            self.assertIn("### Pre-commit review workflow", readme)
            self.assertIn("### CI/CD validation workflow", readme)
  expected_scorecard:
    44: # File Docstring Uses One Label per Referent
      pass # File Docstring establishes only one label for each referent.
    46: # Terms Reuse Shared Vocabulary
      fail # `README` and `README contents` rename the canonical file name README.md instead of reproducing it verbatim.
