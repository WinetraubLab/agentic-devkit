# Test-source examples for agent review.
# Each example contains only `file_docstring`, `test`, and `expected_scorecard`.
# Criteria omitted from `expected_scorecard` are ignored during comparison.
# Criterion comments must match their titles in `single_test_review.agent.md.j2`.
# Each outcome must be `pass` or `fail` followed by an explanation comment.

mocking_disclosure_001:
  file_docstring: |
    """Tests in this file validate `collect_records` located at `src/records.py`.
    `collect_records` retrieves records through a paginated client.
    """
  test: |
    def test_collects_available_records():
        """Test Path: happy path

        Requirement Tested:
        `collect_records` returns every record supplied by its client in order.
        Standard usage: The scenario demonstrates baseline behavior.

        Verification Method: verify public function output

        Verification Detail:
        The result contains every supplied record.
        """

        rows = [{"id": "item-a", "label": "Sample A"}, {"id": "item-b", "label": "Sample B"}]

        class Client:
            def query(self):
                return self

            def range(self, start, end):
                return {"data": rows[start:end + 1], "error": None}

        assert collect_records(Client()) == rows
  expected_scorecard:
    24: # Mocked Dependencies Are Disclosed
      fail # The handwritten client replaces database paging, but Verification Detail does not disclose the dependency replacement.

