# Test-source examples for agent review.
# Each example contains only `file_docstring`, `test`, and `expected_scorecard`.
# Criteria omitted from `expected_scorecard` are ignored during comparison.
# Criterion comments must match their titles in `single_test_review.agent.md.j2`.
# Each outcome must be `pass` or `fail` followed by an explanation comment.

requirement_formulation_001_availability_without_behavior:
  file_docstring: |
    """Tests in this file validate `availability_policy` located at `src/examples/availability_policy.py`.
    `availability_policy` is responsible for selecting availability windows for organizations.

    For example, this file contains one test function.
    """
  test: |
    def test_organization_availability() -> None:
        """Test Path: happy path

        Requirement Tested:
        When organization is home, availability includes 09:00–12:00; when organization is Y, availability excludes 13:00–16:00.
        Specialized usage: For home availability, organization becomes home (instead of Y).

        Verification Method: verify public function output

        Verification Detail:
        Availability contains the expected time ranges.
        """

        availability = compute_availability(organization="home")

        assert "09:00–12:00" in availability
  expected_scorecard:
    16: # Requirement Fits Declared Module Responsibility
      fail # The requirement begins with a scenario condition instead of the declared `availability_policy` module.
    11: # First Line States a General Behavioral Rule
      fail # The requirement lists availability examples without stating a general behavior.
    12: # Second Line Describes a Scenario
      pass # The specialized-usage sentence names the use case, input, standard value, and modified value.
    13: # Requirement Has the Appropriate Specificity
      fail # The first line includes particular organization and time-range examples instead of the material availability policy that governs them.
    14: # Requirement Is Atomic
      fail # The requirement combines independent availability behaviors for two organizations.
    15: # Requirement Begins with the Behavior Owner
      fail # The first requirement sentence begins with the `When` scenario condition instead of the behavior owner.
    21: # Verification Detail States Material Outcomes
      fail # Verification Detail says only expected time ranges instead of naming the observed 09:00–12:00 inclusion.
    51: # Assertions Prove the Stated Requirement
      fail # The assertion checks only the home inclusion and does not prove the Y exclusion.

