requirement_formulation_023_stale_attestation_uses:
  file_docstring: |
    """Tests in this file validate `agent_review_example_runner` located at `tests/agentic_linter/test_harness/agent_review_example_runner.py`.
    `agent_review_example_runner` is responsible for orchestrating YAML-example evaluations.

    Terms:
    - `runner JSON`: Runner JSON is the readable `agent_review_example_runner` report at tests/agentic_linter/test_agent_review_example_runner.json. It contains evaluation results and the reviewer model. For example, every completed YAML-example evaluation overwrites this file.
    - `runner JSONL`: Runner JSONL is the committed proof for criteria enforced by each YAML case at tests/agentic_linter/test_agent_review_example_runner.jsonl. Each record contains its reviewer model. Current proof corresponds to every source and expected scorecard in the `YAML fixture catalog`.
    - `YAML fixture catalog`: The YAML fixture catalog is repository data evaluated by `agent_review_example_runner`. For example, each entry supplies an example and its expected scorecard as the subject of evaluation.
    - `timer start`: Timer start marks when measurement begins for the total time needed to run the agentic linter on the YAML examples. For example, the timer starts before YAML validation.
    - `timer end`: Timer end marks when runtime measurement stops after YAML scorecards have been compared. For example, elapsed review time uses timer end as its completion timestamp.
    """
  test: |
    def test_stale_attestation_uses_score_only(self) -> None:
        """Test Path: failure path

        Requirement Tested:
        `agent_review_example_runner` reports the single score-only '.agent.md' created for a stale `runner JSONL` record by its current source hash.
        Specialized usage: When one `runner JSONL` record contains 64 zero characters instead of its current YAML source hash, `agent_review_example_runner` reports the generated score-only review.

        Verification Method: verify public function output

        Verification Detail:
        1. `SCORECARD_ATTESTATION_PATH` denotes the mocked attestation with one 64-zero source hash.
        2. The `requirement_formulation_004_ambiguous_input_case` copy contains source_sha256 with 64 zero characters instead of its current `YAML fixture catalog` source hash.
        3. RuntimeError contains exactly one bullet line beginning with `- `, containing `test_<current-source-hash>__`, and ending in '.agent.md'.
        4. The artifact directory contains exactly one generated '.agent.md'.
        5. The generated packet directs the reviewer to score once and stop.
        6. The generated packet excludes the review-iteration record.

        Similar Coverage:
        - Lower Level Test: `test_render_agent_md_file.py::test_score_only_stops_after_scoring`
          Justification: Deeper coverage — The lower test directly verifies that score-only rendering excludes the review record and second-revision instruction. The current test proves stale YAML proof selects that renderer behavior.
        """

        examples_path = (
            REPO_ROOT / "tests/agentic_linter/fixtures/single_test_review"
        )
        committed_attestations = (
            REPO_ROOT
            / "tests"
            / "agentic_linter"
            / "test_agent_review_example_runner.jsonl"
        )

        with tempfile.TemporaryDirectory() as temporary_directory:
            temporary_root = Path(temporary_directory)
            anonymous_root = temporary_root / "agent_review_examples"
            artifact_root = anonymous_root / "agentic_review_artifacts"
            attestation_path = temporary_root / "stale.jsonl"
            records = [
                json.loads(line)
                for line in committed_attestations.read_text(
                    encoding="utf-8"
                ).splitlines()
            ]
            stale_record = next(
                record
                for record in records
                if record["yaml_case"] == "requirement_formulation_004_ambiguous_input_case"
            )
            current_source_hash = stale_record["source_sha256"]
            stale_record["source_sha256"] = "0" * 64
            attestation_path.write_text(
                "".join(json.dumps(record) + "\n" for record in records),
                encoding="utf-8",
            )

            with mock.patch.multiple(
                runner_harness,
                ANONYMOUS_ROOT=anonymous_root,
                ARTIFACT_ROOT=artifact_root,
                SCORECARD_ATTESTATION_PATH=attestation_path,
                REVIEW_START_PATH=anonymous_root / ".review_started_at",
            ):
                with self.assertRaises(RuntimeError) as raised:
                    run_agent_review_examples(
                        examples_path=examples_path,
                    )

            error_text = str(raised.exception)
            reported_packets = [
                line
                for line in error_text.splitlines()
                if line.startswith("- ") and line.endswith(".agent.md")
            ]
            generated_packets = tuple(artifact_root.glob("*.agent.md"))
            generated_packet = generated_packets[0].read_text(encoding="utf-8")

        self.assertEqual(1, len(reported_packets))
        self.assertEqual(1, len(generated_packets))
        self.assertIn(f"test_{current_source_hash}__", reported_packets[0])
        self.assertIn(
            "Score the current `Test Content` once against every criterion, "
            "update `## Review Scorecard`, and stop",
            generated_packet,
        )
        self.assertNotIn("## Review Iteration Record", generated_packet)
  expected_scorecard:
    17: # Scenario Has the Appropriate Specificity
      fail # Sixty-four zero characters are an incidental representation because any noncurrent source hash defines the same stale-hash scenario.
    51: # Assertions Prove the Stated Requirement
      pass # The assertions prove that stale proof generates and reports one current-hash score-only packet.

requirement_formulation_024_changed_review_contract:
  file_docstring: |
    """Tests in this file validate `CI/CD linter` located at `src/agentic_devkit/tdd_lint/cli/run_lint_pipeline.py`.
    `CI/CD linter` is responsible for validating committed review proof without creating review packets.

    Terms:
    - `CI/CD linter`: CI/CD linter runs `agentic-devkit tdd lint` in an automated pipeline against committed manifest proof. For example, it validates current proof without generating `.agent.md` files.
    - `.agent.md`: An .agent.md file contains a review scorecard that create-agent-md generates for a test. For example, CI validates committed manifest proof without recreating these files.
    """
  test: |
    def test_changed_review_contract_requires_review(self) -> None:
        """Test Path: failure path

        Requirement Tested:
        `CI/CD linter` requires a new review when a caller modifies repository review documentation after manifest approval.
        When the caller modifies README after persisting manifest proof and the repository lacks an updated `.agent.md`, `CI/CD linter` emits missing_required_agent_md.

        Verification Method: verify public function output

        Verification Detail:
        1. Harness creates a temporary repository containing one valid test and an initial README.
        2. Harness completes its review.
        3. Harness persists passing manifest proof.
        4. Harness modifies only README after manifest approval.
        5. Harness removes existing `.agent.md` files to reproduce `CI/CD linter` input.
        6. Harness invokes `agentic-devkit tdd lint --repo-root <temporary-repository> --reviewer integration:contract-reviewer`.
        7. `CI/CD linter` output contains missing_required_agent_md.

        Similar Coverage:
        - Lower Level Test: `test_build_manifest_from_agent_md_files.py::test_review_contract_changes_with_documentation`
          Justification: Deeper coverage — The lower test proves documentation changes alter the review-contract digest. The current test proves the public CI workflow requires a new review after that change.
        """

        test_source = textwrap.dedent(
            '''\
            """Tests in this file validate `documented behavior` located at `src/documented.py`.
            `documented behavior` is responsible for evaluating a reviewed boolean expression.
            """

            def test_documented_behavior() -> None:
                """Test Path: happy path

                Requirement Tested:
                `documented behavior` evaluates to true.
                Standard usage: The scenario demonstrates baseline behavior.

                Verification Method: verify public function output

                Verification Detail:
                The reviewed expression equals true.
                """

                assert True
            '''
        )

        with tempfile.TemporaryDirectory() as directory:
            repo_root = Path(directory)
            reviewer = "integration:contract-reviewer"
            _write_source(repo_root / "README.md", "Initial review workflow.\n")
            _write_source(repo_root / "src" / "documented.py", "VALUE = True\n")
            _write_source(
                repo_root / "tests" / "test_documented.py",
                test_source,
            )
            _record_approved_manifest(
                repo_root,
                reviewer=reviewer,
                review_status="pass",
                review_evidence="approved review contract",
            )
            _write_source(repo_root / "README.md", "Changed review workflow.\n")
            _remove_packet_directory(repo_root)

            lint = _run_cli(repo_root, "lint", "--reviewer", reviewer)

        self.assertIn("missing_required_agent_md", lint.stdout)
  expected_scorecard:
    17: # Scenario Has the Appropriate Specificity
      fail # README is an incidental artifact because changing any repository review documentation after manifest approval defines the same stale-review-contract scenario.
    51: # Assertions Prove the Stated Requirement
      pass # The assertion proves that stale review-contract proof causes the CI/CD linter to require new review evidence.

