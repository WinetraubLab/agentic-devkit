[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-devkit"
version = "0.7.3"
description = "Tools for agentic development, including TDD test linting and review."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Jinja2>=3.1"]

[project.scripts]
agentic-devkit = "agentic_devkit.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_devkit"]
