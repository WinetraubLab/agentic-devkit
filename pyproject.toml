[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-devkit"
version = "0.9.1"
description = "Tools for agentic development, including TDD linting, review, and policy tooling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Jinja2>=3.1", "PyYAML>=6.0"]

[project.scripts]
agentic-devkit = "agentic_devkit.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_devkit"]
